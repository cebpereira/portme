    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('portme.theme')
          var dark =
            stored === 'dark' ||
            (stored === null && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            document.documentElement.style.colorScheme = 'dark'
          }
        } catch (error) {
        }
      })()
