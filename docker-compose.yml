services:
  api:
    build: ./api
    env_file: .env
    environment:
      PORT: 3001
    expose:
      - "3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-9090}:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
